  <script>
    (function () {
      var loader = document.getElementById('loader');
      if (!loader) return;
      var root = document.getElementById('root');
      if (root) root.style.opacity = '0';

      function revealLanding() {
        // Make the landing instantly present (no fade) so it sits ready
        // BEHIND the still-opaque loader. The loader then fades out on top
        // of it — eliminating any cross-fade flash of the light page bg.
        if (!root) return;
        root.style.transition = 'none';
        root.style.opacity = '1';
      }
      function removeLoader() {
        if (loader.parentNode) loader.parentNode.removeChild(loader);
      }
      function finishCrossfade() {
        revealLanding();
        // Next frame: fade only the loader away, revealing the landing under it.
        requestAnimationFrame(function () {
          loader.classList.add('is-out');
          setTimeout(removeLoader, 450);
        });
      }

      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) {
        // Reduced motion: hold briefly, then reveal with no animation.
        setTimeout(function () { revealLanding(); removeLoader(); }, 100);
        return;
      }

      var frames = loader.querySelectorAll('.loader__frame');
      var logo = loader.querySelector('.loader__logo-img');
      var FRAME_MS = 480; // per-frame cadence — must match the animation-delay
                          // steps on .loader__frame in landing.css.

      // The frame fade-in sequence runs entirely in CSS (compositor), so its
      // rhythm stays perfectly even no matter how busy the main thread is.
      // JS only schedules the finale, after every frame has had its full turn
      // — so nothing is ever cut short.
      setTimeout(startFinale, FRAME_MS * frames.length);

      function startFinale() {
        // 1. fade out tagline + film (0.4s)
        loader.classList.add('is-dispersing');
        setTimeout(flyLogo, 400);
      }

      function flyLogo() {
        var navLogo = document.querySelector('.nav__logo .wm') || document.querySelector('.nav__logo');
        if (!navLogo || !logo) { finishCrossfade(); return; }

        var s = logo.getBoundingClientRect();
        var e = navLogo.getBoundingClientRect();
        var scale = e.height / s.height;
        var tx = e.left - s.left;
        var ty = (e.top + e.height / 2) - (s.top + s.height / 2);

        logo.classList.add('is-flying');
        logo.getBoundingClientRect(); // force reflow before transition
        logo.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';

        // 2. when the logo arrives at the navbar, fade the landing in (0.4s)
        setTimeout(finishCrossfade, 600);
      }
    })();
  </script>

  <!-- ==================== Smooth scroll (Lenis) ==================== -->
  <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>
  <script>
    // Lenis smooth scroll — lerp (continuous damping) mode so the scroll
    // velocity is smoothed no matter how hard the trackpad/wheel is flicked.
    // A strong gesture is absorbed and eased instead of rocketing the page.
    // Disabled under reduced-motion.
    (function () {
      if (!window.Lenis) return;
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var lenis = new Lenis({
        // lerp mode (no duration/easing): every frame the page eases a
        // fraction toward the target → naturally damps spikes in velocity.
        lerp: 0.075,
        smoothWheel: true,
        // Lower multiplier so a hard flick travels a sane distance, not "off
        // to who-knows-where". Tune up if normal scrolling feels too slow.
        wheelMultiplier: 0.7,
        touchMultiplier: 1.1,
        // Native momentum on touch feels better than smoothing it.
        syncTouch: false
      });
      window.__lenis = lenis;
      function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
      requestAnimationFrame(raf);
    })();
  </script>

  <!-- ==================== App scripts (reveal, smooth scroll, cookies) ==================== -->
  <script>
    // Wait for the React tree to actually mount before tagging nodes —
    // Babel finishes transforming after window.load, so we poll on #root
    // having real children + a known landing selector being present.
    function whenMounted(fn) {
      const start = Date.now();
      function tick() {
        const root = document.getElementById('root');
        const ready = root && root.children.length > 0 && document.querySelector('.section');
        if (ready) return fn();
        if (Date.now() - start > 8000) return fn(); // give up — run anyway
        requestAnimationFrame(tick);
      }
      tick();
    }

    whenMounted(() => {
      // 0) Optionally load Cookiebot if a real ID has been provided.
      const CBID = window.MATLYST_COOKIEBOT_ID;
      if (CBID && !CBID.includes('REPLACE')) {
        const s = document.createElement('script');
        s.id = 'Cookiebot';
        s.src = 'https://consent.cookiebot.com/uc.js';
        s.setAttribute('data-cbid', CBID);
        s.setAttribute('data-blockingmode', 'auto');
        s.async = true;
        document.head.appendChild(s);
      }

      // 1) Reveal-on-scroll — fade + slide up.
      const targets = [
        '.section__head',
        '.section__sub',
        '.feature-card',
        '.step',
        '.bento-tile',
        '.stat',
        '.testimonial',
        '.waitlist__card',
        '.faq__item',
      ];
      const nodes = Array.from(document.querySelectorAll(targets.join(',')))
        .filter(n => !n.closest('#que-es')); // #que-es has its own choreography
      nodes.forEach(n => n.setAttribute('data-reveal', ''));

      // Stagger: 100ms between elements within the same section, so a
      // section's pieces cascade in rather than all popping at once.
      const revReduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (!revReduce) {
        const groups = new Map();
        nodes.forEach(n => {
          const sec = n.closest('section, footer, .feat, .community') || document.body;
          const arr = groups.get(sec) || [];
          arr.push(n);
          groups.set(sec, arr);
        });
        groups.forEach(arr => {
          arr.forEach((n, i) => {
            n.style.transitionDelay = (Math.min(i, 6) * 100) + 'ms';
          });
        });
      }

      // rAF-throttled getBoundingClientRect check. Reliable in any iframe /
      // preview / embedded webview where IntersectionObserver is throttled.
      let pending = nodes.slice();
      let frame = 0;

      function check() {
        frame = 0;
        const vh = window.innerHeight || document.documentElement.clientHeight;
        const trigger = vh - 60; // reveal when ~60px into viewport
        const still = [];
        for (let i = 0; i < pending.length; i++) {
          const el = pending[i];
          const r = el.getBoundingClientRect();
          if (r.top < trigger && r.bottom > 0) {
            el.classList.add('is-in');
          } else {
            still.push(el);
          }
        }
        pending = still;
        if (pending.length === 0) {
          window.removeEventListener('scroll', schedule, { passive: true });
          window.removeEventListener('resize', schedule);
        }
      }
      function schedule() {
        if (frame) return;
        frame = requestAnimationFrame(check);
      }

      check(); // reveal anything already in view (hero head, etc.)
      window.addEventListener('scroll', schedule, { passive: true });
      window.addEventListener('resize', schedule);

      // 1b) "El problema" section — bespoke choreography.
      //     Head cascade (fade+rise, 150ms stagger) when the heading enters,
      //     and the numbered rows slide in (fade+translateX, 200ms stagger)
      //     with their divider rules drawing L→R as the next row arrives.
      (function () {
        const prob = document.querySelector('.section--problem');
        if (!prob) return;
        const reduceMo = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (reduceMo) { prob.classList.add('head-in', 'pains-in'); return; }

        const headEl = prob.querySelector('.problem-head');
        const painsEl = prob.querySelector('.pains');
        let gotHead = false, gotPains = false, pframe = 0;
        const vh = () => window.innerHeight || document.documentElement.clientHeight;

        function pcheck() {
          pframe = 0;
          const margin = 80;
          if (!gotHead && headEl) {
            const r = headEl.getBoundingClientRect();
            if (r.top < vh() - margin && r.bottom > 0) { gotHead = true; prob.classList.add('head-in'); }
          }
          if (!gotPains && painsEl) {
            const r = painsEl.getBoundingClientRect();
            if (r.top < vh() - margin && r.bottom > 0) { gotPains = true; prob.classList.add('pains-in'); }
          }
          if (gotHead && gotPains) {
            window.removeEventListener('scroll', psched, { passive: true });
            window.removeEventListener('resize', psched);
          }
        }
        function psched() { if (pframe) return; pframe = requestAnimationFrame(pcheck); }
        pcheck();
        window.addEventListener('scroll', psched, { passive: true });
        window.addEventListener('resize', psched);
      })();

      // 1c) "Qué es Matlyst" (#que-es) — head cascade + cards stagger.
      (function () {
        const sec = document.querySelector('#que-es');
        if (!sec) return;
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          sec.classList.add('whatis-in');
          return;
        }
        let got = false, wframe = 0;
        const vh = () => window.innerHeight || document.documentElement.clientHeight;
        function wcheck() {
          wframe = 0;
          if (got) return;
          const r = sec.getBoundingClientRect();
          if (r.top < vh() - 100 && r.bottom > 0) {
            got = true;
            sec.classList.add('whatis-in');
            window.removeEventListener('scroll', wsched, { passive: true });
            window.removeEventListener('resize', wsched);
          }
        }
        function wsched() { if (wframe) return; wframe = requestAnimationFrame(wcheck); }
        wcheck();
        window.addEventListener('scroll', wsched, { passive: true });
        window.addEventListener('resize', wsched);
      })();

      // 2) Smooth scroll for in-page nav anchors only (href="#id").
      document.querySelectorAll('a[href^="#"]').forEach(a => {
        a.addEventListener('click', (e) => {
          const id = a.getAttribute('href').slice(1);
          if (!id) return;
          const el = document.getElementById(id);
          if (!el) return;
          e.preventDefault();
          // Route through Lenis when active so the anchor jump shares the
          // same easing as wheel scrolling; fall back to native otherwise.
          if (window.__lenis) {
            window.__lenis.scrollTo(el, { offset: -100, duration: 1.2 });
          } else {
            const y = el.getBoundingClientRect().top + window.pageYOffset - 100;
            window.scrollTo({ top: y, behavior: 'smooth' });
          }
          history.replaceState(null, '', '#' + id);
        });
      });
    });
  </script>
